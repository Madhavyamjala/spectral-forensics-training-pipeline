# SAFER - the configuration of the ICLR 2027 submission.
#
# Task: binary Real vs AI-Generated on Chrono-66k, i.e. the Real (Kinetics-400) and AI-Generated
# (VidProM: Pika, VideoCrafter2) rows of the Chrono-TriClass-100k manifest: 53,334 train / 6,636 valid /
# 6,676 test videos, split by source clip (SHA-256), 80/10/10 stratified.
#
# Every value that the paper states is pinned here explicitly (Section 3.2, Table 6, Appendix B) rather than
# left to a code default, so this file is the single record of the paper's settings. Batch sizes assume four
# GPUs (the paper used 4x NVIDIA H200 NVL): per-GPU batch x grad_accum x 4 GPUs = effective batch 64.
#
# Format normalisation: the paper evaluates on videos letterboxed to 854x480, 24 fps, first 10 s, no audio,
# H.264 CRF 23 yuv420p. This config trains on whatever files the dataset repo serves.
#
# Same stages and outputs as configs/full_2class.yaml, which differs only in run name, directories and the
# latency-benchmark size.
run_name: safer
mode: full
seed: 42

paths:
  work_dir: ./runs/safer
  cache_dir: ./cache/safer
  video_dir: ./cache/safer/videos

data:
  repo_id: madhav-yrc/Chrono-TriClass-100k
  manifest: manifest.csv
  classes: [real, ai_generated]      # Chrono-66k
  max_rows: null
  num_frames: 16                     # 16 uniformly sampled frames per video
  frame_size: 224                    # scanner input, 224x224
  mosaic_frames: 4                   # arbiter input: 2x2 mosaic ...
  mosaic_size: 560                   # ... at 560x560
  patch_size: 64
  num_patches: 8
  tool_max_side: 1024                # tools run on native-resolution frames, capped at 1024 px
  jpeg_quality: 95
  delete_videos_after_cache: true
  keep_videos_for_latency: 1000
  download_workers: 16
  prefetch: 48

models:
  qwen_id: Qwen/Qwen2.5-VL-3B-Instruct
  llama_id: meta-llama/Llama-3.2-11B-Vision-Instruct
  vae_id: stabilityai/stable-video-diffusion-img2vid-xt   # latent (DIRE) tools
  vae_subfolder: vae
  vae_fallback_id: stabilityai/sd-vae-ft-mse
  attn_implementation: sdpa

train:
  num_workers: 8
  tf32: true
  qwen:                              # scanner (Table 6)
    quantization: none               # bf16
    epochs: 2                        # 1,666 optimiser steps at effective batch 64
    batch_size: 4
    eval_batch_size: 8
    grad_accum: 4
    lr: 1.0e-4                       # adapter
    head_lr: 5.0e-4
    warmup_ratio: 0.03
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    label_smoothing: 0.05
    optimizer: adamw
    eval_every: 500
    save_every: 500
    max_eval_batches: 250
    early_stop_patience: 4
  llama:                             # arbiter (Table 6)
    quantization: 4bit               # 4-bit LoRA; vision tower, projector and lm_head stay bf16
    skip_quant_modules: [vision_model, multi_modal_projector, lm_head]
    epochs: 1                        # 833 optimiser steps at effective batch 64
    batch_size: 2
    eval_batch_size: 4
    grad_accum: 8
    lr: 1.0e-4
    head_lr: 5.0e-4
    warmup_ratio: 0.03
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    label_smoothing: 0.05
    tool_dropout: 0.3                # tool groups dropped with p = 0.3 during training
    optimizer: adamw_8bit
    eval_every: 500
    save_every: 250
    max_eval_batches: 250
    early_stop_patience: 3
  dispatcher:                        # Appendix B
    train_videos: 6000               # the validation outcome table (85% GRPO / 15% model selection)
    iterations: 1500
    batch_videos: 256
    group_size: 16                   # sampled actions per video
    inner_epochs: 2
    lr: 3.0e-4
    clip_eps: 0.2                    # PPO clip range
    kl_beta: 0.02                    # KL to the initial policy
    entropy_coef: 0.01
    hidden_dim: 256                  # two-layer MLP
    alpha_attr: 0.0                  # no manipulation masks

eval:
  # Ultra-Fast (lambda=1, beta=0, latent disabled), Balanced (lambda=0.2, beta=0.5), Max-Security (lambda=0, beta=2)
  profiles: [ultra_fast, balanced, max_security]
  latency_samples: 1000              # in-domain latency harness: 1,000 held-out videos (Table 8)
  latency_warmup: 5
  ece_bins: 15

hub:
  private: true
  prompt_for_push: true
