# FULL TWO-CLASS TRAINING RUN - Real vs AI-Generated only.
# Uses the same end-to-end stages as configs/full.yaml, but excludes AI-Edited from
# train / valid / test and reports metrics only over the active two-class label set.
run_name: csf-full-2class
mode: full
seed: 42

paths:
  work_dir: ./runs/full_2class
  cache_dir: ./cache/full_2class
  video_dir: ./cache/full_2class/videos

data:
  repo_id: madhav-yrc/Chrono-TriClass-100k
  manifest: manifest.csv
  classes: [real, ai_generated]
  max_rows: null
  num_frames: 16
  frame_size: 224
  mosaic_frames: 4
  mosaic_size: 560
  patch_size: 64
  num_patches: 8
  tool_max_side: 1024
  jpeg_quality: 95
  delete_videos_after_cache: true
  keep_videos_for_latency: 100
  download_workers: 16
  prefetch: 48

models:
  qwen_id: Qwen/Qwen2.5-VL-3B-Instruct
  llama_id: meta-llama/Llama-3.2-11B-Vision-Instruct
  vae_id: stabilityai/stable-video-diffusion-img2vid-xt
  vae_subfolder: vae
  vae_fallback_id: stabilityai/sd-vae-ft-mse
  attn_implementation: sdpa

train:
  num_workers: 8
  qwen:
    quantization: none
    epochs: 2
    batch_size: 4
    eval_batch_size: 8
    grad_accum: 4
    lr: 1.0e-4
    head_lr: 5.0e-4
    warmup_ratio: 0.03
    lora_r: 32
    lora_alpha: 64
    optimizer: adamw
    eval_every: 500
    save_every: 500
    max_eval_batches: 250
    early_stop_patience: 4
  llama:
    quantization: 4bit
    skip_quant_modules: [vision_model, multi_modal_projector, lm_head]
    epochs: 1
    batch_size: 2
    eval_batch_size: 4
    grad_accum: 8
    lr: 1.0e-4
    head_lr: 5.0e-4
    warmup_ratio: 0.03
    lora_r: 32
    lora_alpha: 64
    tool_dropout: 0.3
    optimizer: adamw_8bit
    eval_every: 500
    save_every: 250
    max_eval_batches: 250
    early_stop_patience: 3
  dispatcher:
    train_videos: 6000
    iterations: 1500
    batch_videos: 256
    group_size: 16
    inner_epochs: 2
    lr: 3.0e-4

eval:
  profiles: [ultra_fast, balanced, max_security]
  latency_samples: 100
  latency_warmup: 5

hub:
  private: true
  prompt_for_push: true
