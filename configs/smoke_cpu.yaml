# WIRING SMOKE TEST - runs every stage in minutes on CPU (no GPU, no gated models) using tiny random
# checkpoints with the same architectures as Qwen2.5-VL and Llama-3.2-Vision. Metrics are meaningless;
# the goal is to prove the code paths (download -> cache -> DDP training -> outcomes -> GRPO -> evaluation ->
# export -> inference) execute. Usage: python main.py --config configs/smoke_cpu.yaml --stage all
run_name: csf-smoke
mode: test
seed: 7

paths:
  work_dir: ./runs/smoke
  cache_dir: ./cache/smoke
  video_dir: ./cache/smoke/videos

data:
  manifest: manifest.csv
  max_rows: 60
  num_frames: 4
  frame_size: 112
  mosaic_frames: 4
  mosaic_size: 560
  num_patches: 3
  tool_max_side: 512
  keep_videos_for_latency: 3
  download_workers: 4
  prefetch: 8

models:
  qwen_id: trl-internal-testing/tiny-Qwen2_5_VLForConditionalGeneration
  llama_id: hf-tiny-v2/tiny-random-MllamaForConditionalGeneration
  vae_fallback_id: stabilityai/sd-vae-ft-mse
  attn_implementation: sdpa

train:
  num_workers: 0
  qwen:
    quantization: none
    max_steps: 4
    batch_size: 2
    grad_accum: 2
    optimizer: adamw
    gradient_checkpointing: false
    eval_every: 2
    save_every: 2
  llama:
    quantization: none
    max_steps: 4
    batch_size: 2
    grad_accum: 2
    optimizer: adamw
    gradient_checkpointing: false
    eval_every: 2
    save_every: 2
  dispatcher:
    iterations: 20
    batch_videos: 4
    group_size: 4

eval:
  latency_samples: 3
  latency_warmup: 1

hub:
  prompt_for_push: false
